site_name: Salesforce AI Development Field Guide
site_description: A production-grade methodology for using AI coding tools in Salesforce development. Covers prompt engineering, security, org isolation, and AI-assisted architecture.
site_author: Ibrahim Alameh
site_url: https://ialameh.github.io/salesforce-ai-development-field-guide/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart:
    - 00-quickstart.md
    - Q1. 15-Minute AI Safety Checklist: quickstart/01-ai-safety-checklist.md
    - Q2. AI Tool Setup for Salesforce: quickstart/02-ai-tool-setup.md
  - Foundations:
    - F1. The Salesforce AI Stack: foundations/01-the-salesforce-ai-stack.md
    - F2. Roles and Personas: foundations/02-roles-and-personas.md
    - F3. Prompt Anatomy: foundations/03-prompt-anatomy.md
    - F4. What Salesforce Breaks AI: foundations/04-what-salesforce-breaks-ai.md
  - AI Prompt Engineering:
    - P1. Prompts for Apex: ai-prompt-engineering/01-prompts-for-apex.md
    - P2. Prompts for LWC: ai-prompt-engineering/02-prompts-for-lwc.md
    - P3. Prompts for Flows: ai-prompt-engineering/03-prompts-for-flows.md
    - P4. Prompts for Testing: ai-prompt-engineering/04-prompts-for-testing.md
    - P5. Prompts for CI/CD: ai-prompt-engineering/05-prompts-for-ci-cd.md
    - P6. Planning with AI: ai-prompt-engineering/06-planning-with-ai.md
    - P7. Multi-Agent Workflows: ai-prompt-engineering/07-multi-agent-workflows.md
  - AI Security:
    - S1. The Five Destruction Scenarios: ai-security/01-the-five-destruction-scenarios.md
    - S2. Org Isolation Strategy: ai-security/02-org-isolation-strategy.md
    - S3. Prompt Hygiene: ai-security/03-prompt-hygiene.md
    - S4. AI Tool Permissions Configuration: ai-security/04-ai-tool-permissions-configuration.md
    - S5. Reviewing AI-Generated Code: ai-security/05-reviewing-ai-generated-code.md
    - S6. Secrets Management: ai-security/06-secrets-management.md
    - S7. Compliance Considerations: ai-security/07-compliance-considerations.md
    - S8. AI-Generated Code Audit Trail: ai-security/08-ai-generated-code-audit-trail.md
  - Reference:
    - R1. Prompt Templates Library: reference/01-prompt-templates-library.md
    - R2. Anti-Pattern Catalog: reference/02-anti-pattern-catalog.md
    - R3. AI Tool Settings Reference: reference/03-ai-tool-settings-reference.md
  - Worked Material:
    - WM1. Case Studies: worked-material/01-case-studies.md
    - WM2. Annotated Prompt Examples: worked-material/02-annotated-prompt-examples.md
  - Site and CI:
    - CI1. GitHub Actions Workflow: site-and-ci/01-github-actions-workflow.md
  - Glossary: glossary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ialameh/salesforce-ai-development-field-guide

extra_css:
  - stylesheets/extra.css

