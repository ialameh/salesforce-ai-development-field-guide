name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy content to docs/
        run: |
          mkdir -p docs

          # Individual root markdown files
          for f in README.md CHANGELOG.md CODE_OF_CONDUCT.md CONTRIBUTING.md glossary.md REFERENCES.md VERIFICATION.md 00-quickstart.md; do
            [ -f "$f" ] && cp "$f" "docs/" 2>/dev/null || true
          done

          # Subdirectory chapters
          for dir in quickstart foundations ai-prompt-engineering ai-security reference worked-material site-and-ci; do
            [ -d "$dir" ] && cp -r "$dir" docs/ 2>/dev/null || true
          done

          # Cookbook, templates, diagrams, case-studies
          cp -r cookbook docs/ 2>/dev/null || true
          cp -r templates docs/ 2>/dev/null || true
          cp -r diagrams docs/ 2>/dev/null || true
          cp -r case-studies docs/ 2>/dev/null || true

          # Stylesheets if any
          cp -r stylesheets docs/ 2>/dev/null || true

          # README becomes index
          cp README.md docs/index.md

      - name: Build site
        run: |
          mkdocs build
          # Create .nojekyll to prevent GitHub Pages from processing the site
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4